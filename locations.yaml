# =====================================================================
# AUTO-MODE CACHE
# =====================================================================
# In `auto` / `exclude` modes, the script fetches the location list from
# the API. To avoid hitting the strict quota every single run, we cache
# the result for this many hours. The cache file is `locations_cache.json`.
# Set to 0 to disable caching (not recommended).
auto_cache_hours: 168   # 7 days

# =====================================================================
# METRICS — which daily metrics to pull. Same set as the old Make scenario.
# Other available ones (uncomment to enable):
#   BUSINESS_CONVERSATIONS, BUSINESS_BOOKINGS,
#   BUSINESS_FOOD_ORDERS, BUSINESS_FOOD_MENU_CLICKS
# =====================================================================
metrics:
  - BUSINESS_IMPRESSIONS_DESKTOP_MAPS
  - BUSINESS_IMPRESSIONS_DESKTOP_SEARCH
  - BUSINESS_IMPRESSIONS_MOBILE_MAPS
  - BUSINESS_IMPRESSIONS_MOBILE_SEARCH
  - BUSINESS_DIRECTION_REQUESTS
  - CALL_CLICKS
  - WEBSITE_CLICKS

# =====================================================================
# TIME WINDOW
# =====================================================================
# Normal run window: last N days (GBP has ~2 day reporting lag).
# 14 days = safe overlap; dedup is automatic via DB upsert.
lookback_days: 14

# Initial backfill window for `backfill.bat`.
# Start with 180; bump to 540 (~18 months, the GBP max) when comfortable.
initial_backfill_days: 540

# =====================================================================
# RATE LIMITING
# =====================================================================
# Pause (seconds) between Performance API calls for different locations.
pause_between_locations_sec: 2

# =====================================================================
# PHASES
# =====================================================================
# Keywords: monthly search-term impressions (Keywords tab).
enable_keywords: true
# Day-of-week sub-entity: GBP returns HTTP 400 for all our locations, so it
# only burns requests. The dashboard derives day-of-week from daily data.
enable_dayofweek: false
