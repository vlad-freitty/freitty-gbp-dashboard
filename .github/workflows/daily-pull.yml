name: Daily GBP pull

on:
  schedule:
    - cron: "15 6 * * *"   # every day 06:15 UTC (08:15 Kyiv in winter, 09:15 in summer)
  workflow_dispatch:
    inputs:
      days:
        description: "Days to re-pull (14 = normal; up to 540 for a full backfill)"
        default: "14"
      locations:
        description: "Only these hubs (comma-separated names or ids from locations.yaml); empty = all"
        default: ""

permissions:
  contents: write

concurrency:
  group: gbp-pull
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Rebuild gbp.db from site/data.json
        run: python data_io.py import

      - name: Pull from Google Business Profile
        id: pull
        env:
          GBP_TOKEN_JSON: ${{ secrets.GBP_TOKEN_JSON }}
          DAYS: ${{ inputs.days || '14' }}
          ONLY: ${{ inputs.locations || '' }}
        run: |
          set +e
          if [ -n "$ONLY" ]; then python pull_gbp.py --days "$DAYS" --locations "$ONLY"; else python pull_gbp.py --days "$DAYS"; fi
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          # 0 = ok, 2 = partial (some locations failed) -> still publish what we got
          if [ $code -ne 0 ] && [ $code -ne 2 ]; then exit $code; fi

      - name: Export site/data.json
        run: python data_io.py export

      # Vercel (Hobby) only auto-deploys private-repo commits authored by the
      # account owner, so the data commit is authored as the repo owner.
      - name: Commit and push
        env:
          AUTHOR_NAME: ${{ vars.COMMIT_AUTHOR_NAME || github.repository_owner }}
          AUTHOR_EMAIL: ${{ vars.COMMIT_AUTHOR_EMAIL }}
        run: |
          git config user.name "$AUTHOR_NAME"
          git config user.email "${AUTHOR_EMAIL:-292901951+vlad-freitty@users.noreply.github.com}"
          git add site/data.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "data: GBP pull $(date -u +%F)"
          git push

      - name: Flag partial pull
        if: steps.pull.outputs.code == '2'
        run: echo "::warning::Some locations failed this run; they will be retried tomorrow (14-day overlap)."
